<script>
const KEY='tp_v1',AK='tp_gemini_key',ORK='tp_ors_key';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{dest:null,origin:'',start:'',end:'',pax:2,pref:'',pace:'medio',days:[],check:[],budget:[],wx:null};
const VALID_TABS=['viaggio','itin','prenota','budget','salvati','dati'];
const requestedTab=new URLSearchParams(location.search).get('tab'),rememberedTab=localStorage.getItem('tp_last_tab');
let tab=VALID_TABS.includes(requestedTab)?requestedTab:VALID_TABS.includes(rememberedTab)?rememberedTab:'viaggio',res=[],busy='',itineraryDay=0;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const TABS={viaggio:['🧭','Viaggio'],itin:['🗓️','Itinerario'],prenota:['🎫','Prenota'],budget:['💶','Budget']};
let pendingInstallPrompt=null;
function standaloneMode(){return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function syncInstallButton(){const button=$('installApp');if(button)button.hidden=!pendingInstallPrompt||standaloneMode()}
async function installPwa(){if(!pendingInstallPrompt)return;pendingInstallPrompt.prompt();try{await pendingInstallPrompt.userChoice}catch(e){}pendingInstallPrompt=null;syncInstallButton()}
function updateOfflineStatus(){const notice=$('offlineStatus');if(notice)notice.hidden=navigator.onLine}
function initPwa(){initializeTabHistory();updateOfflineStatus();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(error=>console.warn('Service worker non disponibile:',error));syncInstallButton()}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();pendingInstallPrompt=event;syncInstallButton()});
window.addEventListener('appinstalled',()=>{pendingInstallPrompt=null;syncInstallButton()});
window.addEventListener('online',updateOfflineStatus);window.addEventListener('offline',updateOfflineStatus);
function navigateTab(next,{replace=false,scroll=false}={}){if(!VALID_TABS.includes(next))return;tab=next;try{localStorage.setItem('tp_last_tab',next)}catch(e){}try{const url=new URL(location.href);url.searchParams.set('tab',next);history[replace?'replaceState':'pushState']({tripPlannerTab:next},'',url)}catch(e){}render();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function initializeTabHistory(){try{const url=new URL(location.href);url.searchParams.set('tab',tab);history.replaceState({tripPlannerTab:tab},'',url)}catch(e){}}
window.addEventListener('popstate',event=>{const fromState=event.state?.tripPlannerTab,fromUrl=new URLSearchParams(location.search).get('tab'),next=VALID_TABS.includes(fromState)?fromState:VALID_TABS.includes(fromUrl)?fromUrl:'viaggio';tab=next;try{localStorage.setItem('tp_last_tab',next)}catch(e){}render()});
const dateOrdinal=value=>{const m=/^(20\d{2})-(\d{2})-(\d{2})$/.exec(String(value||''));if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3],stamp=Date.UTC(y,mo-1,d),check=new Date(stamp);return check.getUTCFullYear()===y&&check.getUTCMonth()===mo-1&&check.getUTCDate()===d?Math.floor(stamp/864e5):null};
const dateSpanDays=(start,end)=>{const a=dateOrdinal(start),b=dateOrdinal(end);if(a==null||b==null)return 0;const n=b-a+1;return n>=1&&n<=90?n:0};
const nDays=()=>dateSpanDays(S.start,S.end);
const dName=()=>S.dest?S.dest.name.split(',')[0]:'';
const dateOf=i=>{if(!S.start)return 'data non impostata';const d=new Date(S.start+'T12:00:00');if(!Number.isFinite(+d))return 'data non impostata';d.setDate(d.getDate()+i);return d.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})};
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' '+dName());

function render(){
  const stopCount=S.days.reduce((n,d)=>n+(d.stops||[]).length,0),checks=S.check.length?S.check:BASE.map(t=>({t,d:false})),done=checks.filter(c=>c.d).length,total=S.budget.reduce((n,b)=>n+(+b.v||0),0),ready=!!(S.dest&&nDays());
  $('nav').innerHTML=Object.entries(TABS).map(([k,[icon,label]])=>{const status=k==='itin'?`${stopCount} tappe`:k==='prenota'?`${done}/${checks.length}`:k==='budget'?(S.budget.length?`${total.toFixed(0)} €`:''):'';const disabled=!ready&&(k==='itin'||k==='prenota');return `<button type="button" class="${k==tab?'on':''}" ${disabled?'disabled title="Scegli prima destinazione e date" aria-label="'+label+': scegli prima destinazione e date"':'onclick="navigateTab(\''+k+'\')"'}><span class="nav-icon">${icon}</span><span class="nav-label">${label}</span>${status?`<span class="nav-status">${status}</span>`:''}</button>`}).join('');
  sub();
  $('m').innerHTML=({viaggio:vViaggio,itin:vItin,prenota:vPrenota,budget:vBudget,salvati:vSalvati,dati:vDati})[tab]();$('m').classList.toggle('itin-grid',tab==='itin');syncInstallButton();
}
