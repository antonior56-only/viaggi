async function commonDayStartAction(action,...args){

   await new Promise(resolve=>navigator.geolocation.getCurrentPosition(pos=>{if(activeId===sourceId&&days.every((d,i)=>S.days[i]===d)){days[0].startPlace='Posizione attuale';days[0].startPoint={n:'Posizione attuale',lat:pos.coords.latitude,lon:pos.coords.longitude}}resolve()},()=>{alert('Posizione non disponibile o permesso negato.');resolve()},{enableHighAccuracy:true,timeout:12000,maximumAge:60000}));

  render();
 }finally{pendingOperations--}
}
