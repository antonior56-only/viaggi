    const from=index?stops[index-1]:day.startPoint;if(from){const leg=travelSegmentsFor(from,stop);if(leg.length)segments.push(...leg);const route=actualWalkRoute(from,stop),segmentDistance=leg.length&&leg.every(x=>Number.isFinite(+x.distanceMeters))?leg.reduce((sum,x)=>sum+(+x.distanceMeters),0)/1000:null,air=distanceKm(from,stop);if(route){distance+=route.distanceMeters/1000;distanceLegs++}else if(segmentDistance!=null){distance+=segmentDistance;distanceLegs++}else if(air!=null){distance+=air;distanceLegs++;straightLineDistance=true}}

  });
  const required=draft?[]:normalizeMustStopEntries(S.mustStops).filter(x=>x.name&&x.day===index+1),missing=required.filter(req=>!stops.some(stop=>samePlaceLabel(stop.n,req.name)));
